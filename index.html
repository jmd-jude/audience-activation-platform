<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graphent</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F0EDE6;
    --cream-dark: #E5E0D6;
    --black: #1A1A1A;
    --orange: #D4532A;
    --orange-light: #E8754F;
    --gray-600: #555;
    --gray-400: #999;
    --gray-300: #BBB;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--black);
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .wordmark {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(2.4rem, 5vw, 4rem);
    font-weight: 400;
    letter-spacing: -0.02em;
    color: var(--black);
    margin-bottom: 1rem;
  }

  .tagline {
    font-family: 'DM Sans', sans-serif;
    font-size: clamp(0.95rem, 1.3vw, 1.1rem);
    color: var(--gray-400);
    font-weight: 400;
    letter-spacing: 0.01em;
  }

  /* ── Nav Bar ── */
  .nav-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 56px;
    display: flex;
    align-items: center;
    padding: 0 2rem;
    z-index: 100;
    background: linear-gradient(transparent, rgba(240,237,230,0.95) 30%);
  }

  /* ── Deck Switcher ── */
  .deck-switcher {
    position: relative;
    display: flex;
    align-items: center;
  }

  .deck-trigger {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1rem;
    color: var(--gray-300);
    cursor: pointer;
    letter-spacing: 0.05em;
    user-select: none;
    transition: color 0.2s;
    padding: 4px 6px;
    border-radius: 4px;
  }

  .deck-switcher:hover .deck-trigger {
    color: var(--gray-400);
  }

  .deck-menu {
    position: absolute;
    bottom: 20px;
    left: 0;
    background: white;
    border: 1px solid var(--cream-dark);
    border-radius: 6px;
    padding: 0.4rem 0 1.2rem;
    min-width: 140px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    opacity: 0;
    pointer-events: none;
    transform: translateY(6px);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .deck-switcher:hover .deck-menu {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }

  .deck-menu a {
    display: block;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    color: var(--gray-600);
    text-decoration: none;
    padding: 0.5rem 1rem;
    transition: background 0.15s, color 0.15s;
  }

  .deck-menu a:hover {
    background: var(--cream);
    color: var(--orange);
  }

  .deck-menu-divider {
    height: 1px;
    background: var(--cream-dark);
    margin: 0.4rem 0;
  }

  .deck-menu a.external {
    color: var(--gray-400);
  }

  .deck-menu a.external:hover {
    background: var(--cream);
    color: var(--orange);
  }
</style>
</head>
<body>

  <p class="wordmark">Graphent</p>
  <p class="tagline">Better custom audiences. Faster.</p>

  <nav class="nav-bar">
    <div class="deck-switcher">
      <span class="deck-trigger">···</span>
      <div class="deck-menu">
        <!-- <a href="platform.html">Platform</a> -->
        <a href="dp.html">Data Partner</a>
        <a href="agency.html">Agency</a>
        <div class="deck-menu-divider"></div>
        <a href="https://graphent.app" target="_blank" rel="noopener" class="external">Launch App ↗</a>
      </div>
    </div>
  </nav>

</body>
</html>
